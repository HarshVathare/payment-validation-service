# create Configuration for Database with SQL
spring.datasource.url=jdbc:mysql://localhost:3306/validation
spring.datasource.username=root
spring.datasource.password=Harsh@9595
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# what to do with the database schema when the application starts.
spring.jpa.hibernate.ddl-auto=update

# Prints all SQL queries executed by Hibernate in the application logs for debugging.
spring.jpa.show-sql=true

# Formats the generated SQL into a readable, indented structure in the logs.
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Dialect tells Hibernate which database it is talking to so it can generate the correct SQL syntax for that database.
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.open-in-view=false


